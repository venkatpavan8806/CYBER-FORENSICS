<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
               font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e8eef0; }
  svg { display: block; width: 100%; }
  .leaf, .card { cursor: pointer; }
  .leaf text, .card text { pointer-events: none; }
  .leaf:hover .lbl { fill: #ffffff; }
  .card:hover .cardbox { stroke: rgba(241,217,160,.55); }
  @keyframes pulse { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  .orbglow { animation: pulse 3.6s ease-in-out infinite; }
  .flow { stroke-dasharray: 3 9; animation: flow 1.4s linear infinite; }
  @keyframes leafIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: var(--op, 1); transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateX(-18px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes orbIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .enter { animation: leafIn .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
  .cardin { animation: cardIn .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
  .orbin { animation: orbIn .8s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
  .drawp { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease forwards; animation-delay: var(--d, 0s); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const W = 900;
const GOLD = "#f1d9a0";
const TONES = { high: "#ef4a5f", medium: "#f2a93b", low: "#6fbf73", info: "#5b8cff", none: "#94a1b8" };
const STATUS = { confirmed: "#2fbf71", false_positive: "#6b7280", uncertain: "#f2a93b", unreviewed: null, none: null };
const ICONS = {
  alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.01"/>',
  folder: '<path d="M3 7h6l2 2h10v10H3z"/>',
  registry: '<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
  log: '<path d="M7 3h8l4 4v14H7z"/><path d="M10 12h6M10 16h6"/>',
  shield: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',
};

function post(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function chip(x, y, text, color, filled) {
  const w = Math.round(text.length * 5.7 + 12);
  return {
    w: w,
    svg: '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="15" rx="4" fill="' + color +
      '" fill-opacity="' + (filled ? 0.16 : 0.06) + '" stroke="' + color + '" stroke-opacity="' + (filled ? 0.7 : 0.35) + '" stroke-width="0.8"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (y + 10.8) + '" text-anchor="middle" font-size="9" font-weight="600" fill="' + color + '">' + esc(text) + '</text>',
  };
}

function stream(pathId, dur, begin, r, color) {
  return '<circle r="' + r + '" fill="' + color + '" opacity="0" filter="url(#glow)">' +
    '<animateMotion dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"><mpath href="#' + pathId + '"/></animateMotion>' +
    '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"/></circle>';
}
function fitHeight() {
  if (!window.__H) return;
  post("streamlit:setFrameHeight", { height: Math.round(window.__H * document.documentElement.clientWidth / W) });
}

function render(args) {
  const key = JSON.stringify(args);
  const same = key === window.__key;
  window.__key = key;
  if (same) { fitHeight(); return; }
  const data = args.data, sel = args.selected || {};
  const cats = data.categories, kase = data.case;
  const selCat = cats.find(function (c) { return c.id === sel.category; }) || cats[0];
  const items = selCat.items, n = items.length;
  const first = !window.__rendered;
  const enter = first || window.__lastCat !== selCat.id || window.__lastRun !== data.case.name + '|' + data.case.findings;
  window.__rendered = true; window.__lastCat = selCat.id; window.__lastRun = data.case.name + '|' + data.case.findings;
  const dsel = enter;

  const rowH = 50;
  const H = Math.max(720, n * rowH + 140, cats.length * 76 + 170);
  const cy = H / 2;
  const orbX = 118, orbY = cy - 8;
  const cardX = 246, cardW = 150, cardH = 58, cardGap = 16;
  const cardsTotal = cats.length * cardH + (cats.length - 1) * cardGap;
  const cardY0 = cy - cardsTotal / 2;
  const selIdx = cats.indexOf(selCat);
  const selCardY = cardY0 + selIdx * (cardH + cardGap) + cardH / 2;
  const fanX0 = cardX + cardW;
  const step = n > 1 ? Math.min(rowH, (H - 140) / (n - 1)) : 0;

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  s += '<defs>' +
    '<radialGradient id="orb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e6ccff"/><stop offset=".45" stop-color="#9b5cff"/><stop offset="1" stop-color="#3a1590"/></radialGradient>' +
    '<radialGradient id="disc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".8" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="' + fanX0 + '" y1="0" x2="640" y2="0"><stop offset="0" stop-color="' + GOLD + '" stop-opacity=".95"/><stop offset="1" stop-color="' + GOLD + '" stop-opacity=".3"/></linearGradient>' +
    '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>' +
    '<path id="ring" d="M ' + orbX + ' ' + (orbY - 56) + ' A 56 56 0 1 1 ' + (orbX - 0.01) + ' ' + (orbY - 56) + '"/>' +
    '</defs>';

  // orb + disc
  s += '<circle cx="' + orbX + '" cy="' + cy + '" r="106" fill="url(#disc)"/>';
  s += '<circle cx="' + orbX + '" cy="' + cy + '" r="106" fill="none" stroke="rgba(255,255,255,.07)"/>';
  s += '<circle cx="' + orbX + '" cy="' + orbY + '" r="56" fill="none" stroke="rgba(190,160,255,.18)"/>';
  [0, 2].forEach(function (b) {
    s += '<circle cx="' + orbX + '" cy="' + orbY + '" r="32" fill="none" stroke="#b98cff" stroke-width="1" opacity="0">' +
      '<animate attributeName="r" values="32;66" dur="4s" begin="' + b + 's" repeatCount="indefinite"/>' +
      '<animate attributeName="opacity" values=".5;0" dur="4s" begin="' + b + 's" repeatCount="indefinite"/></circle>';
  });
  s += '<g><animateTransform attributeName="transform" type="rotate" from="0 ' + orbX + ' ' + orbY + '" to="360 ' + orbX + ' ' + orbY + '" dur="46s" repeatCount="indefinite"/>' +
    '<text font-size="7.5" fill="rgba(205,180,255,.6)" letter-spacing="2"><textPath href="#ring" textLength="350" lengthAdjust="spacing">RANSOMTRACE · EVIDENCE CASE · RANSOMTRACE · EVIDENCE CASE · RANSOMTRACE · EVIDENCE</textPath></text></g>';
  s += '<g class="' + (first ? 'orbin' : '') + '">' +
    '<circle class="orbglow" cx="' + orbX + '" cy="' + orbY + '" r="30" fill="#9b5cff" opacity=".55" filter="url(#soft)"><animate attributeName="r" values="30;35;30" dur="4s" repeatCount="indefinite"/></circle>' +
    '<circle cx="' + orbX + '" cy="' + orbY + '" r="30" fill="url(#orb)"><animate attributeName="r" values="30;32;30" dur="4s" repeatCount="indefinite"/></circle></g>';
  s += '<text x="' + orbX + '" y="' + (orbY + 76) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">' + esc(trunc(kase.name, 22)) + '</text>';
  s += '<text x="' + orbX + '" y="' + (orbY + 91) + '" text-anchor="middle" font-size="9.5" fill="#94a1b8">' + esc(kase.sub) + '</text>';
  const rtone = TONES[kase.risk] || TONES.none;
  const rtext = kase.findings + (kase.findings === 1 ? " finding" : " findings");
  const rc = chip(0, 0, rtext, rtone, true);
  s += '<g transform="translate(' + (orbX - rc.w / 2) + ',' + (orbY + 100) + ')">' + rc.svg + '</g>';

  // orb -> cards
  cats.forEach(function (c, i) {
    const y = cardY0 + i * (cardH + cardGap) + cardH / 2;
    const on = i === selIdx;
    s += '<path id="o2c' + i + '" pathLength="1" class="' + (first ? 'drawp' : '') + '" style="--d:' + (0.15 + i * 0.1).toFixed(2) + 's" d="M' + (orbX + 34) + ',' + orbY + ' C ' + (orbX + 80) + ',' + orbY + ' ' + (cardX - 50) + ',' + y + ' ' + cardX + ',' + y +
      '" fill="none" stroke="' + GOLD + '" stroke-opacity="' + (on ? 0.85 : 0.28) + '" stroke-width="' + (on ? 1.4 : 0.9) + '"' + (on ? ' filter="url(#glow)"' : '') + '/>';
    s += stream('o2c' + i, (3.2 + i * 0.25).toFixed(2), (i * 0.35).toFixed(2), on ? 2.4 : 1.6, GOLD);
    s += stream('o2c' + i, (3.2 + i * 0.25).toFixed(2), (1.6 + i * 0.35).toFixed(2), on ? 2.4 : 1.6, GOLD);
  });

  // fan: selected card -> items
  const pts = [];
  for (let i = 0; i < n; i++) {
    const y = n === 1 ? cy : cy - ((n - 1) / 2) * step + i * step;
    const t = (y - cy) / (H / 2);
    const x = 560 + 78 * (1 - t * t);
    pts.push({ x: x, y: y, t: t });
  }
  pts.forEach(function (p, i) {
    const it = items[i];
    const on = sel.category === selCat.id && sel.item === it.id;
    const dx = p.x - fanX0;
    const op = n > 10 ? 1 - 0.5 * Math.pow(Math.abs(p.t), 3) : 1;
    s += '<path id="f2l' + i + '" pathLength="1" class="' + (enter ? 'drawp' : '') + '" style="--d:' + (0.3 + i * 0.07).toFixed(2) + 's" d="M' + fanX0 + ',' + selCardY + ' C ' + (fanX0 + dx * 0.5) + ',' + selCardY + ' ' + (fanX0 + dx * 0.45) + ',' + p.y + ' ' + p.x + ',' + p.y +
      '" fill="none" stroke="url(#gold)" stroke-opacity="' + (on ? 1 : 0.55 * op) + '" stroke-width="' + (on ? 1.8 : 1) + '"' + (on ? ' filter="url(#glow)"' : '') + '/>';
    if (on) {
      s += stream('f2l' + i, '1.8', '0', 2.6, '#ffffff') + stream('f2l' + i, '1.8', '0.6', 2.6, '#ffffff') + stream('f2l' + i, '1.8', '1.2', 2.6, '#ffffff');
    } else {
      s += stream('f2l' + i, (3.6 + (i % 3) * 0.5).toFixed(2), (0.5 + i * 0.3).toFixed(2), 1.8, GOLD);
    }
    if (on) {
      s += '<path class="flow" d="M' + fanX0 + ',' + selCardY + ' C ' + (fanX0 + dx * 0.5) + ',' + selCardY + ' ' + (fanX0 + dx * 0.45) + ',' + p.y + ' ' + p.x + ',' + p.y +
        '" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>';
    }
  });
  if (n === 0) {
    s += '<text x="560" y="' + cy + '" font-size="13" fill="#94a1b8">Nothing flagged in this group</text>';
  }

  pts.forEach(function (p, i) {
    const it = items[i];
    const on = sel.category === selCat.id && sel.item === it.id;
    const op = n > 10 ? 1 - 0.5 * Math.pow(Math.abs(p.t), 3) : 1;
    const tone = TONES[it.tone] || TONES.info;
    const lx = p.x + 16;
    const lbl = trunc(it.label, 30);
    s += '<g class="leaf' + (enter ? ' enter' : '') + '" style="--d:' + (0.45 + i * 0.07).toFixed(2) + 's;--op:' + op + '" data-cat="' + selCat.id + '" data-item="' + esc(it.id) + '" opacity="' + op + '"><title>' + esc(it.label) + '</title>';
    const c1 = chip(lx, p.y + 6, trunc(it.sub, 26), "#94a1b8", false);
    const c2 = chip(lx + c1.w + 6, p.y + 6, it.badge, tone, true);
    const width = Math.max(lbl.length * 6.7, c1.w + c2.w + 30) + 16;
    if (on) {
      s += '<rect x="' + (p.x - 12) + '" y="' + (p.y - 20) + '" width="' + (width + 18) + '" height="48" rx="10" fill="' + GOLD + '" fill-opacity=".08" stroke="' + GOLD + '" stroke-opacity=".6"/>';
    } else {
      s += '<rect x="' + (p.x - 12) + '" y="' + (p.y - 20) + '" width="' + (width + 18) + '" height="48" rx="10" fill="transparent"/>';
    }
    if (on) {
      s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="6" fill="none" stroke="' + GOLD + '" opacity="0"><animate attributeName="r" values="6;17" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/></circle>';
    }
    s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (on ? 6 : 4) + '" fill="' + GOLD + '"' + (on ? ' filter="url(#glow)"' : '') + '>' +
      '<animate attributeName="r" values="' + (on ? '6;7.4;6' : '4;4.9;4') + '" dur="' + (2.4 + (i % 4) * 0.35).toFixed(2) + 's" repeatCount="indefinite"/></circle>';
    s += '<text class="lbl" x="' + lx + '" y="' + (p.y - 3) + '" font-size="12.5" font-weight="' + (on ? 600 : 500) + '" fill="' + (on ? "#fff" : "#cfd8dc") + '">' + esc(lbl) + '</text>';
    s += c1.svg + c2.svg;
    const sc = STATUS[it.status];
    const dotX = lx + c1.w + c2.w + 16;
    if (it.status && it.status !== "none") {
      s += sc ? '<circle cx="' + dotX + '" cy="' + (p.y + 13.5) + '" r="4" fill="' + sc + '"/>'
              : '<circle cx="' + dotX + '" cy="' + (p.y + 13.5) + '" r="3.6" fill="none" stroke="#94a1b8" stroke-opacity=".7"/>';
    }
    s += '</g>';
  });

  // category cards
  cats.forEach(function (c, i) {
    const y = cardY0 + i * (cardH + cardGap);
    const on = i === selIdx;
    s += '<g class="card" data-cat="' + c.id + '" data-first="' + (c.items[0] ? esc(c.items[0].id) : "") + '" transform="translate(' + cardX + ',' + y + ')"><g class="' + (first ? 'cardin' : '') + '" style="--d:' + (0.1 + i * 0.09).toFixed(2) + 's">';
    s += '<rect class="cardbox" width="' + cardW + '" height="' + cardH + '" rx="11" fill="' + (on ? "rgba(241,217,160,.09)" : "rgba(255,255,255,.045)") +
      '" stroke="' + (on ? GOLD : "rgba(255,255,255,.14)") + '" stroke-width="' + (on ? 1.6 : 1) + '"' + (on ? ' filter="url(#glow)"' : '') + '>' + (on ? '<animate attributeName="stroke-opacity" values=".65;1;.65" dur="2.8s" repeatCount="indefinite"/>' : '') + '</rect>';
    s += '<g transform="translate(14,15)" fill="none" stroke="' + (on ? GOLD : "#94a1b8") + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><svg viewBox="0 0 24 24" width="20" height="20">' + (ICONS[c.icon] || "") + '</svg></g>';
    s += '<text x="46" y="29" font-size="20" font-weight="600" fill="#fff">' + c.count + '</text>';
    s += '<text x="46" y="46" font-size="10.5" fill="#94a1b8">' + esc(c.label) + '</text>';
    s += '</g></g>';
  });

  s += '</svg>';
  document.getElementById("root").innerHTML = s;

  document.querySelectorAll(".leaf").forEach(function (el) {
    el.addEventListener("click", function () {
      post("streamlit:setComponentValue", { value: { category: el.dataset.cat, item: el.dataset.item }, dataType: "json" });
    });
  });
  document.querySelectorAll(".card").forEach(function (el) {
    el.addEventListener("click", function () {
      post("streamlit:setComponentValue", { value: { category: el.dataset.cat, item: el.dataset.first || null }, dataType: "json" });
    });
  });

  window.__H = H;
  fitHeight();
}

window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "streamlit:render") { window.__args = e.data.args; render(e.data.args); }
});
window.addEventListener("resize", fitHeight);
post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
